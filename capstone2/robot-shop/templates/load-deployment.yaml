apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  labels:
    service: load
spec:
  replicas: 1
  selector:
    matchLabels:
      service: load
  template:
    metadata:
      labels:
        service: load
    spec:
      containers:
        - name: load
          image: robotshop/rs-load:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: "http://web:8080/"
            - name: NUM_CLIENTS
              value: "10"
            - name: SILENT
              value: "1"
            - name: ERROR
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
