# Example Alertmanager route for Capstone 2.
#
# This file is documentation, not an applied values file. Merge the block into
# kube-prometheus-stack-values.yaml, replace the placeholder with a real Slack
# incoming-webhook URL, then run:
#
#   helm upgrade --install kube-prometheus-stack \
#     prometheus-community/kube-prometheus-stack \
#     -n observability \
#     -f capstone2/observability/kube-prometheus-stack-values.yaml
#
# Do not commit a real webhook URL. Prefer a Kubernetes Secret plus
# `api_url_file` if you need to keep it out of values files.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: slack
          continue: false
    receivers:
      - name: slack
        slack_configs:
          - api_url: "https://hooks.slack.com/services/REPLACE/ME"
            channel: "#alerts"
            send_resolved: true
            title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
            text: >-
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
