apiVersion: v1
kind: ConfigMap
metadata:
  name: robot-shop-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Robot Shop"
data:
  robot-shop.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Total request rate across the four graded Robot Shop services: web, catalogue, cart and payment.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\"}[5m]))",
              "legendFormat": "requests/sec",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Server-side 5xx error ratio across the four graded services. The SLO alert threshold is 5% for 5 minutes.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\",response_code=~\"5..\"}[5m])) / clamp_min(sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\"}[5m])), 0.001))",
              "legendFormat": "5xx %",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "5xx error ratio",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Aggregate p95 latency across the four graded services. The SLO alert threshold is 500 ms for 5 minutes.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 300 },
                  { "color": "red", "value": 500 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\"}[5m])) by (le))",
              "legendFormat": "p95",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "p95 latency",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Deployments in the robot-shop namespace with at least one ready replica.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 12 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(kube_deployment_status_replicas_ready{namespace=\"robot-shop\"} > 0)",
              "legendFormat": "ready deployments",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Ready deployments",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Requests per second by destination service, measured by Envoy/Istio.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 5,
          "options": {
            "legend": { "calcs": [], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\"}[5m])) by (destination_service_name)",
              "legendFormat": "{{destination_service_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Requests by service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Server-side 5xx responses by destination service.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 6,
          "options": {
            "legend": { "calcs": [], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\",response_code=~\"5..\"}[5m])) by (destination_service_name)",
              "legendFormat": "{{destination_service_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "5xx errors by service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "95th percentile request duration by destination service.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "id": 7,
          "options": {
            "legend": { "calcs": [], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\"}[5m])) by (le, destination_service_name))",
              "legendFormat": "{{destination_service_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "p95 latency by service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "4xx and 5xx responses by service and status code, useful for separating client errors from server failures.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "id": 8,
          "options": {
            "legend": { "calcs": [], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\",destination_service_namespace=\"robot-shop\",destination_service_name=~\"web|catalogue|cart|payment\",response_code=~\"4..|5..\"}[5m])) by (destination_service_name, response_code)",
              "legendFormat": "{{destination_service_name}} {{response_code}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "4xx / 5xx by status code",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Ready replicas per deployment. A value below the desired replica count means a rollout or runtime problem.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 10, "x": 0, "y": 21 },
          "id": 9,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (deployment) (kube_deployment_status_replicas_ready{namespace=\"robot-shop\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Deployment readiness",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "namespace": true
                },
                "renameByName": {
                  "Value": "Ready replicas",
                  "deployment": "Deployment"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Recent application logs containing the word error. Loki is fed by Fluent Bit from all robot-shop pods.",
          "gridPos": { "h": 9, "w": 14, "x": 10, "y": 21 },
          "id": 10,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{namespace=\"robot-shop\"} |= \"error\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Recent error logs (Loki)",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["robot-shop", "slo", "istio"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Robot Shop - Service Health",
      "uid": "robot-shop-slo",
      "version": 1,
      "weekStart": ""
    }
    
