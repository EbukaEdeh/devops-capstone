# Fluent Bit DaemonSet: tail container logs, enrich with Kubernetes metadata,
# derive a human-readable level, and push to Loki.
kind: DaemonSet

service:
  enabled: true

serviceMonitor:
  enabled: true
  namespace: observability
  interval: 30s

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name lua
        Match kube.*
        script /fluent-bit/etc/conf/level.lua
        call set_level

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.observability.svc.cluster.local
        Port 3100
        Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], service=$kubernetes['labels']['service'], level=$level
        Line_Format json
        Retry_Limit False

  extraFiles:
    level.lua: |
      function set_level(tag, timestamp, record)
        local lvl = record["level"]
        if lvl == nil then
          local line = record["log"] or ""
          if string.find(line, "ERROR") or string.find(line, "error") then
            record["level"] = "error"
          elseif string.find(line, "WARN") or string.find(line, "warn") then
            record["level"] = "warn"
          elseif string.find(line, "DEBUG") or string.find(line, "debug") then
            record["level"] = "debug"
          else
            record["level"] = "info"
          end
        elseif tonumber(lvl) then
          local n = tonumber(lvl)
          local map = {[10]="trace",[20]="debug",[30]="info",[40]="warn",[50]="error",[60]="fatal"}
          record["level"] = map[n] or tostring(n)
        else
          record["level"] = string.lower(tostring(lvl))
        end
        return 1, timestamp, record
      end
