name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy the current SHA or roll back a release"
        type: choice
        options: [deploy, rollback]
        default: deploy
      revision:
        description: "Helm revision for rollback (empty = previous revision)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  HELM_RELEASE: voting-app
  HELM_NAMESPACE: voting

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  lint:
    name: Terraform and Helm lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint deploy/helm/voting-app

      - name: Render chart
        run: |
          helm template voting-app deploy/helm/voting-app \
            --namespace voting \
            --values deploy/helm/voting-app/values-prod.yaml \
            --set postgresql.auth.existingSecret=voting-db-credentials \
            > /tmp/rendered.yaml

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    steps:
      - uses: actions/checkout@v4

      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  build:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            dockerfile: services/vote/Dockerfile
          - service: result
            dockerfile: services/result/Dockerfile
          - service: worker
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Set image reference
        id: image
        run: |
          image="${REGISTRY}/${IMAGE_NAMESPACE,,}/${{ matrix.service }}:${GITHUB_SHA}"
          echo "ref=${image}" >> "$GITHUB_OUTPUT"
          echo "Building ${image}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.image.outputs.ref }}"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.action == 'deploy') &&
      vars.AWS_ROLE_ARN != ''
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: voting-app-gha

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Create database secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD repository secret is not set" >&2
            exit 1
          fi
          kubectl create namespace "$HELM_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$HELM_NAMESPACE" create secret generic voting-db-credentials \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade
        env:
          IMAGE_NAMESPACE_LOWER: ${{ env.IMAGE_NAMESPACE }}
        run: |
          namespace="${IMAGE_NAMESPACE_LOWER,,}"
          helm upgrade --install "$HELM_RELEASE" deploy/helm/voting-app \
            --namespace "$HELM_NAMESPACE" \
            --values deploy/helm/voting-app/values-prod.yaml \
            --set images.vote.repository="${REGISTRY}/${namespace}/vote" \
            --set images.vote.tag="${GITHUB_SHA}" \
            --set images.result.repository="${REGISTRY}/${namespace}/result" \
            --set images.result.tag="${GITHUB_SHA}" \
            --set images.worker.repository="${REGISTRY}/${namespace}/worker" \
            --set images.worker.tag="${GITHUB_SHA}" \
            --set postgresql.auth.existingSecret=voting-db-credentials \
            --set ingress.enabled=false \
            --atomic --wait --timeout 10m

      - name: Verify rollout
        run: |
          kubectl -n "$HELM_NAMESPACE" rollout status deploy/"$HELM_RELEASE"-vote --timeout=120s
          kubectl -n "$HELM_NAMESPACE" rollout status deploy/"$HELM_RELEASE"-result --timeout=120s
          kubectl -n "$HELM_NAMESPACE" rollout status deploy/"$HELM_RELEASE"-worker --timeout=120s
          kubectl -n "$HELM_NAMESPACE" get pods

      - name: Write deployment summary
        run: |
          {
            echo "### Deployment complete"
            echo ""
            echo "- Release: \`$HELM_RELEASE\`"
            echo "- Namespace: \`$HELM_NAMESPACE\`"
            echo "- Image tag: \`${GITHUB_SHA}\`"
            echo "- Chart: \`deploy/helm/voting-app\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && vars.AWS_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: voting-app-rollback

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Roll back
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          helm -n "$HELM_NAMESPACE" history "$HELM_RELEASE"
          if [ -n "$REVISION" ]; then
            helm -n "$HELM_NAMESPACE" rollback "$HELM_RELEASE" "$REVISION" --wait --timeout 5m
          else
            helm -n "$HELM_NAMESPACE" rollback "$HELM_RELEASE" --wait --timeout 5m
          fi
          kubectl -n "$HELM_NAMESPACE" rollout status deploy/"$HELM_RELEASE"-vote --timeout=120s

      - name: Write rollback summary
        run: |
          {
            echo "### Rollback complete"
            echo ""
            echo "- Release: \`$HELM_RELEASE\`"
            echo "- Revision: \`${REVISION:-previous}\`"
          } >> "$GITHUB_STEP_SUMMARY"
