global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: vote
    metrics_path: /metrics
    static_configs:
      - targets: ["vote:8080"]
        labels:
          service: vote

  - job_name: result
    metrics_path: /metrics
    static_configs:
      - targets: ["result:8080"]
        labels:
          service: result

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          service: worker
