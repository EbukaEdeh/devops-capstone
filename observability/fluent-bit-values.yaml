# Helm values for fluent/fluent-bit.
# Install with:
#   helm upgrade --install fluent-bit fluent/fluent-bit \
#     --namespace observability \
#     --values observability/fluent-bit-values.yaml
kind: DaemonSet

image:
  repository: fluent/fluent-bit
  tag: "3.2.2"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

tolerations:
  - operator: Exists

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Health_Check On
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 32MB
        Skip_Long_Lines On
        Refresh_Interval 10

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations Off

    [FILTER]
        Name grep
        Match kube.*
        Regex $kubernetes['namespace_name'] ^voting$

    [FILTER]
        Name nest
        Match kube.*
        Operation lift
        Nested_under kubernetes
        Add_prefix kubernetes_

    [FILTER]
        Name modify
        Match kube.*
        Add cluster voting-capstone

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki-gateway.observability.svc.cluster.local
        Port 80
        Labels job=fluent-bit,cluster=$cluster,namespace=$kubernetes_namespace_name,service=$kubernetes_labels_app_kubernetes_io_component,level=$level
        Line_format json

    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines
