{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voting-app.fullname" . }}-postgresql
  labels:
    {{- include "voting-app.componentLabels" (dict "context" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "result") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voting-app.fullname" . }}-redis
  labels:
    {{- include "voting-app.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "vote") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
