apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting-app.fullname" . }}-result
  labels:
    {{- include "voting-app.componentLabels" (dict "context" . "component" "result") | nindent 4 }}
    monitoring.voting-app/metrics: "true"
spec:
  type: {{ .Values.result.service.type }}
  selector:
    {{- include "voting-app.componentSelectorLabels" (dict "context" . "component" "result") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.result.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.result.service.type "NodePort") .Values.result.service.nodePort }}
      nodePort: {{ .Values.result.service.nodePort }}
      {{- end }}
