{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "voting-app.fullname" . }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: voting-app.rules
      rules:
        - alert: VotingAppPodDown
          expr: |
            sum by (pod) (
              up{namespace="{{ .Release.Namespace }}", pod=~"{{ include "voting-app.fullname" . }}-(vote|result|worker)-.*"}
            ) == 0
          for: 5m
          labels:
            severity: critical
            service: voting-app
          annotations:
            summary: "Voting App pod {{"{{"}} $labels.pod {{"}}"}} is down"
            description: "Prometheus has not been able to scrape this pod for 5 minutes."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#pod-down"

        - alert: VotingAppHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: critical
            service: voting-app
          annotations:
            summary: "Voting App 5xx rate is above 5%"
            description: "The user-facing error rate has exceeded the 5% fast-burn threshold."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#high-error-rate"

        - alert: VotingAppHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            service: voting-app
          annotations:
            summary: "Voting App p95 latency is above 500 ms"
            description: "The p95 latency SLO is burning. Check database and Redis latency."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#high-latency"

        - alert: VotingQueueBacklog
          expr: max(vote_queue_depth{namespace="{{ .Release.Namespace }}"}) > 50
          for: 5m
          labels:
            severity: warning
            service: voting-app
          annotations:
            summary: "Votes are queueing in Redis"
            description: "More than 50 votes have been waiting for 5 minutes. Check the worker."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#queue-backlog"

        - alert: VotingFreshnessAtRisk
          expr: max(vote_queue_oldest_age_seconds{namespace="{{ .Release.Namespace }}"}) > 60
          labels:
            severity: warning
            service: voting-app
          annotations:
            summary: "A queued vote is older than the 60s freshness target"
            description: "The oldest vote in Redis has been waiting more than 60 seconds. The freshness SLO (99% of votes within 60s) is burning; check the worker and PostgreSQL before the queue backs up further."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#queue-backlog"

        - alert: VotingWorkerStalled
          expr: |
            max(vote_queue_depth{namespace="{{ .Release.Namespace }}"}) > 0
            and
            sum(rate(votes_processed_total{namespace="{{ .Release.Namespace }}"}[10m])) == 0
          for: 10m
          labels:
            severity: critical
            service: voting-app
          annotations:
            summary: "The vote worker is not draining the queue"
            description: "Votes are waiting but no worker has written to PostgreSQL for 10 minutes."
            runbook_url: "https://github.com/your-org/voting-app/blob/main/docs/RUNBOOK.md#worker-stalled"
{{- end }}
